name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: windows-latest # The tests also run on .NET Framework 4.8.
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # The library and the tools target .NET 10; the tests also run on .NET 8.
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Display .NET Version
        run: dotnet --version
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Install LibreOffice
        # For CsvHelper.Excel's tests that convert workbooks with LibreOffice (tests/CsvHelper.Excel.Tests/Corpus/LibreOffice.cs),
        # which are skipped without it: the version their differences were checked with, from The Document Foundation's
        # archive, checked against the SHA-256 it publishes.
        run: |
          $ProgressPreference = "SilentlyContinue"
          $msi = Join-Path $env:RUNNER_TEMP "LibreOffice_26.8.2.2_Win_x86-64.msi"
          Invoke-WebRequest "https://downloadarchive.documentfoundation.org/libreoffice/old/26.8.2.2/win/x86_64/LibreOffice_26.8.2.2_Win_x86-64.msi" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne "FF4B911403B67EE9E6249F820F9782C44BB32C94FDAA45B0DA53A8E419E5307A") { throw "LibreOffice's installer has SHA-256 $hash." }
          $install = Start-Process msiexec.exe -ArgumentList "/i", "`"$msi`"", "/qn", "/norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "msiexec exited with $($install.ExitCode)." }
          "LibreOffice " + (Get-Item "C:\Program Files\LibreOffice\program\soffice.exe").VersionInfo.ProductVersion
      - name: Test
        # Each test's output goes in a TRX file, for the artifact below: the console shows only failing tests' output, and
        # passing tests say things worth keeping, such as a written workbook's culture that isn't compared, or the fuzzers'
        # tallies.
        run: dotnet test --configuration Release --no-restore --no-build --logger trx --results-directory TestResults
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
      - name: Check CsvHelper.Excel with NativeAOT
        # CsvHelper.Excel reads [ExcelSheet] and [ExcelColumn] through reflection over the members a record type's
        # annotation keeps. The app (tests/CsvHelper.Excel.Aot) is published with NativeAOT, where its project makes a trim
        # or AOT warning an error, and its native build writes a sheet of such a type, checks its look, and reads it back.
        run: |
          dotnet publish tests/CsvHelper.Excel.Aot --configuration Release --runtime win-x64 -o aot-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./aot-check/CsvHelper.Excel.Aot.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check CsvHelper.Excel Package
        # CsvHelper.Excel uses CsvHelper's internals, so its package must depend on its exact CsvHelper version. The
        # PinCsvHelperVersion target of its project does that through NuGet's internal pack targets; this fails if they
        # change. It also checks the frameworkAssembly entry of net47, which needs System.IO.Compression for ZipArchive.
        run: |
          dotnet pack src/CsvHelper.Excel --configuration Release --no-build -o pack-check -p:PackageVersion=0.0.0-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("pack-check/CsvHelper.Excel.0.0.0-ci.nupkg")
          try {
            $reader = [System.IO.StreamReader]::new($zip.GetEntry("CsvHelper.Excel.nuspec").Open())
            [xml]$nuspec = $reader.ReadToEnd()
            $reader.Dispose()
          } finally {
            $zip.Dispose()
          }
          $metadata = $nuspec.package.metadata
          $groups = @($metadata.dependencies.group)
          $pinned = @($groups | Where-Object { @($_.dependency | Where-Object { $_.id -eq "CsvHelper" -and $_.version -eq "[0.0.0-ci]" }).Count -eq 1 })
          if ($groups.Count -eq 0 -or $pinned.Count -ne $groups.Count) {
            throw "Every target of CsvHelper.Excel must depend on CsvHelper [0.0.0-ci]:`n$($metadata.dependencies.OuterXml)"
          }
          $compression = @($metadata.frameworkAssemblies.frameworkAssembly | Where-Object { $_.assemblyName -eq "System.IO.Compression" -and $_.targetFramework -eq ".NETFramework4.7" })
          if ($compression.Count -ne 1) {
            throw "The net47 target of CsvHelper.Excel must reference System.IO.Compression:`n$($metadata.frameworkAssemblies.OuterXml)"
          }
          "CsvHelper.Excel depends on CsvHelper [0.0.0-ci] in all $($groups.Count) targets, and on System.IO.Compression in net47."
